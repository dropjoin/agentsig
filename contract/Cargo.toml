[package]
name = "agentsig-policy"
version = "0.2.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
near-sdk = "5"

[dev-dependencies]
# Enables near-sdk unit-test mocks (testing_env!, mocked promises). Only
# active for `cargo test`; the wasm build is unaffected.
near-sdk = { version = "5", features = ["unit-testing"] }

[profile.release]
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
codegen-units = 1
